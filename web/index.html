<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Bouncer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body data-state="boot">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="stage"></canvas>
  <div id="flash"></div>

  <header id="hud">
    <div class="brand">FOCUS BOUNCER</div>
    <div class="clock"><span id="clockLabel">FOCUSED</span><b id="clock">0:00</b></div>
    <div id="pill" class="pill">LOADING</div>
  </header>

  <aside id="log"><div class="log-head">SESSION LOG</div><ol id="logList"></ol></aside>

  <div id="counters"><span>ARRESTS <b id="nArrests">0</b></span><span>JAILBREAKS <b id="nBreaks">0</b></span></div>

  <section id="booking" hidden>
    <div class="card mug"><canvas id="mugCanvas"></canvas><div class="stamp" id="bookedStamp">BOOKED</div></div>
    <div class="card exhibit">
      <div class="exhibit-head"><span class="rec">●</span> EXHIBIT A <span id="exhibitTime"></span><span class="speed">0.5×</span></div>
      <canvas id="replay"></canvas>
    </div>
  </section>

  <div id="banner" hidden><div class="b1" id="bannerTitle"></div><div class="b2" id="bannerSub"></div></div>

  <section id="center" class="center" hidden>
    <div class="big" id="centerBig"></div>
    <div class="sub" id="centerSub"></div>
    <div class="hint" id="centerHint"></div>
  </section>

  <section id="casefile" hidden>
    <canvas id="caseCanvas"></canvas>
    <div class="hint">R — new session &nbsp;·&nbsp; saved to <span id="casePath">logs/</span></div>
  </section>

  <div id="debug" hidden></div>
  <div id="keys">ENTER start · SPACE arrest · E exile · C calibrate · D debug · Q case file · R reset · F fullscreen</div>

  <script type="module" src="app.js"></script>
</body>
</html>
